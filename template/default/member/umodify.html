{include file=comm/head.html}

{include file=comm/top.html}

<div class="container pages">

	{include file=comm/position.html}

	<div class="row mb-5">

		{include file=member/left.html}

        <div class="col-12 col-md-10 mt-3">
        		<form onsubmit="return umodify(this);">

	        		<div class="form-group">
	                    <label for="username">{i18n:Username}：</label>
	                    <div>
	                        {user:username}
	                    </div>
	                </div>

	                <div class="form-group">
	                    <label for="headpic">{i18n:Avatar}：</label>
		               	<input type="text" name="headpic" id="headpic" value="{user:headpic}" class="form-control" placeholder="{i18n:EnterAvatarURL}">
		               	<div style="height:100px; width:100px; border:1px solid #ccc; margin-top:5px; border-radius:2px">
		               		<img src="{user:headpic}" id="headpic_preview" style="max-width:100%;max-height:100%">
		               	</div>
	                </div>

	                <div class="form-group">
	                    <label for="useremail">{i18n:Email}：</label>
	                    <div>
	                        <input type="text" name="useremail" value="{user:useremail}" autocomplete="off" class="form-control" placeholder="{i18n:EnterEmail}">
	                    </div>
	                </div>

	                <div class="form-group">
	                    <label for="usermobile">{i18n:Mobile}：</label>
	                    <div>
	                        <input type="text" name="usermobile" value="{user:usermobile}" autocomplete="off" class="form-control" placeholder="{i18n:EnterMobile}">
	                    </div>
	                </div>

	                <div class="form-group">
	                    <label for="nickname">{i18n:Nickname}：</label>
	                    <div>
	                        <input type="text" name="nickname" value="{user:nickname}" autocomplete="off" class="form-control" placeholder="{i18n:EnterNickname}">
	                    </div>
	                </div>

	                <div class="form-group">
	                    <label for="password">{i18n:NewPassword}：</label>
	                    <div>
	                        <input type="password" name="password" class="form-control" autocomplete="off" placeholder="{i18n:LeaveBlankIfNotModify}">
	                    </div>
	                </div>

	                <div class="form-group">
	                    <label for="rpassword">{i18n:ConfirmPassword}：</label>
	                    <div>
	                        <input type="password" name="rpassword" class="form-control" autocomplete="off" placeholder="{i18n:EnterConfirmPassword}">
	                    </div>
	                </div>

	                <div class="form-group">
	                    <label for="sex">{i18n:Gender}：</label>
	                    <div>
	                         <select class="form-control" name="sex" id="sex">
							  <option value="男" {gboot:if('{user:sex}'=='男')}selected{/gboot:if}>{i18n:Male}</option>
							  <option value="女" {gboot:if('{user:sex}'=='女')}selected{/gboot:if}>{i18n:Female}</option>
							</select>
	                    </div>
	                </div>

	                <div class="form-group">
	                    <label for="birthday">{i18n:Birthday}：</label>
                        <div>
	                        <input class="form-control" type="date" name="birthday" id="birthday" value="{user:birthday}">
	                    </div>
	                </div>

	                <div class="form-group">
	                    <label for="telephone">{i18n:Phone}：</label>
	                    <div>
	                        <input type="text" name="telephone" value="{user:telephone}" autocomplete="off" class="form-control" placeholder="{i18n:EnterPhone}">
	                    </div>
	                </div>

	                <div class="form-group">
	                    <label for="qq">{i18n:WhatsApp}：</label>
	                    <div>
	                        <input type="text" name="qq" value="{user:qq}" autocomplete="off" class="form-control" placeholder="{i18n:EnterWhatsApp}">
	                    </div>
	                </div>

	                <div class="form-group">
	                    <label for="opassword">{i18n:CurrentPassword}：<span class="text-danger">*</span></label>
	                    <div>
	                        <input type="password" name="opassword" required autocomplete="off" class="form-control" placeholder="{i18n:EnterCurrentPassword}">
	                    </div>
	                </div>

	                <div class="form-group">
	                   <button type="submit" class="btn btn-info">{i18n:Save}</button>
	                   <a href="{gboot:ucenter}" class="btn btn-light">{i18n:Back}</a>
	               </div>
               </form>
        </div>
   </div>

</div>

<script>

//ajax修改資料
function umodify(obj){
  var url='{gboot:umodify}';
  var data = $(obj).serialize();

  $.ajax({
    type: 'POST',
    url: url,
    dataType: 'json',
    data: data,
    success: function (response, status) {
      if(response.code){
    	 alert(response.msg);
		 location.href= response.tourl;
      }else{
    	 alert(response.data || response.msg);
      }
    },
    error:function(xhr,status,error){
      alert('返回數據異常！');
    }
  });
  return false;
}

//頭像預覽
$(document).ready(function(){
	$('#headpic').on('input', function(){
		$('#headpic_preview').attr('src', $(this).val());
	});
});
</script>

{include file=comm/foot.html}
